<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shorten — Simple & Fast URL Shortener</title>

    <meta
      name="description"
      content="Shorten long URLs into simple, shareable links. Create short URLs quickly and keep track of your generated links and clicks in one place."
    />

    <meta
      name="keywords"
      content="URL shortener, link shortener, short URL, shorten URL, URL generator, short links, link tracking, click tracking"
    />

    <meta name="author" content="Shorten" />

    <meta name="robots" content="index, follow" />

    <meta name="language" content="English" />

    <meta name="theme-color" content="#ffffff" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Shorten — Simple & Fast URL Shortener" />

    <meta
      property="og:description"
      content="Turn long URLs into simple, shareable links and keep track of your links and clicks."
    />

    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <meta property="og:image" content="%VITE_SITE_URL%/logo.png" />

    <meta property="og:site_name" content="Shorten" />

    <!-- Twitter / X -->

    <meta
      name="twitter:title"
      content="Shorten — Simple & Fast URL Shortener"
    />

    <meta
      name="twitter:description"
      content="Create short, shareable URLs and keep track of your links and clicks."
    />

    <meta name="twitter:image" content="%VITE_SITE_URL%/logo.png" />

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="apple-touch-icon" href="/logo.png" />
